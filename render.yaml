services:
  # Backend API
  - type: web
    name: exosynergy-backend
    env: python
    buildCommand: cd exoplanet/backend && pip install -r requirements.txt
    startCommand: cd exoplanet/backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    routes:
      - type: rewrite
        source: /api/.*
        destination: /api
      - type: rewrite
        source: /atmosphere
        destination: /atmosphere
      - type: rewrite
        source: /preprocess
        destination: /preprocess
    
  # Static Site
  - type: web
    name: exosynergy
    env: static
    buildCommand: cd exoplanet/frontend && npm install && npm run build
    staticPublishPath: ./exoplanet/frontend/dist
    routes:
      - type: rewrite
        source: /.*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
