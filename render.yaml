services:
  # Static Site
  - type: web
    name: exosynergy
    env: static
    buildCommand: cd exoplanet/frontend && npm install && npm run build
    staticPublishPath: ./exoplanet/frontend/dist
    routes:
      - type: rewrite
        source: /.*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
